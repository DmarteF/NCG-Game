name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências
        run: npm install

      - name: Gerar build web
        run: npm run build

      - name: Instalar Capacitor
        run: npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Criar config Capacitor se não existir
        run: |
          if [ ! -f capacitor.config.json ]; then
            npx cap init "NCG Game" "com.ncg.game" --web-dir=dist
          fi

      - name: Adicionar Android se não existir
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sincronizar Android
        run: npx cap sync android

      - name: Permitir Gradle executar
        run: chmod +x android/gradlew

      - name: Gerar APK Debug
        run: cd android && ./gradlew assembleDebug

      - name: Enviar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: NCG-Game-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
